<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archenlicht · Designvorschau</title>
<style>@font-face{font-family:ArchenlichtCaveat;src:url('./fonts/Caveat.ttf')}*{box-sizing:border-box}body{margin:0;padding:32px;background:#f3f3ef;color:#163e29;font:16px system-ui}main{max-width:1050px;margin:auto;display:grid;grid-template-columns:1fr 390px;gap:40px}h1{font:36px Georgia}label{display:block;margin:18px 0 7px}input,textarea,select,button{font:inherit;width:100%;padding:12px;border:1px solid #a6b99b;border-radius:8px;background:white;color:#163e29}button{margin-top:16px;cursor:pointer;background:#163e29;color:white}canvas{width:100%;height:auto;box-shadow:0 8px 30px #163e2920}small{display:block;line-height:1.5}#error{color:#9d302a}input[type=checkbox]{width:auto}@media(max-width:750px){main{grid-template-columns:1fr}canvas{max-width:390px}}</style>
<main><section><h1>Dein Vers. Dein Motiv.</h1><p>Sechs Blanko-Motive auf hellem Cremeweiß.</p><small>Layoutstudie · noch keine Druckfreigabe für ein Handymodell.</small><label for="design">Motiv</label><select id="design"></select><label for="mode">Gestaltung</label><select id="mode"><option value="fixed">Feste Kollektion</option><option value="custom">Wunschvers ausprobieren</option></select><label for="reference">Versstelle</label><input id="reference" maxlength="60"><label for="excerpt">Kurzer Versauszug (optional)</label><textarea id="excerpt" maxlength="140" rows="3" placeholder="Für die Vorschau eigenen Testtext eingeben"></textarea><label for="dedication">Widmung (optional)</label><input id="dedication" maxlength="50"><label><input id="guides" type="checkbox"> Textflächen anzeigen</label><p id="error" role="alert"></p><button id="download">Vorschau als PNG speichern</button><small>Export: 962 × 1635 Pixel. Texte werden separat hinzugefügt. Für den Shop dürfen nur geprüfte, zur Nutzung freigegebene Bibeltexte verwendet werden.</small></section><canvas id="preview" width="962" height="1635" aria-label="Designvorschau"></canvas></main>
<script type="module">
import {renderDesign} from './renderer.js';
const catalog=await (await fetch('./designs.json')).json();const $=id=>document.getElementById(id);let serial=0;
for(const d of catalog.designs){const o=document.createElement('option');o.value=d.id;o.textContent=d.title;$('design').append(o);}
function current(){return catalog.designs.find(d=>d.id===$('design').value)}
async function update(){const ticket=++serial;$('download').disabled=true;$('error').textContent='';const d=current(),fixed=$('mode').value==='fixed';for(const key of ['reference','excerpt','dedication'])$(key).disabled=fixed;
 const values=fixed?{reference:d.reference}:{reference:$('reference').value,excerpt:$('excerpt').value,dedication:$('dedication').value};
 const staging=document.createElement('canvas');staging.width=962;staging.height=1635;
 try{await renderDesign(staging,d,values,{showGuides:$('guides').checked});if(ticket!==serial)return;const ctx=$('preview').getContext('2d');ctx.clearRect(0,0,962,1635);ctx.drawImage(staging,0,0);$('download').disabled=false;}catch(e){if(ticket!==serial)return;$('error').textContent=e.message;$('preview').getContext('2d').clearRect(0,0,962,1635);}}
$('reference').value=current().reference;
$('design').addEventListener('change',()=>{$('reference').value=current().reference;update()});
for(const id of ['mode','reference','excerpt','dedication','guides'])$(id).addEventListener('input',update);
$('download').onclick=async()=>{const c=document.createElement('canvas');c.width=962;c.height=1635;const d=current();const v=$('mode').value==='fixed'?{reference:d.reference}:{reference:$('reference').value,excerpt:$('excerpt').value,dedication:$('dedication').value};await renderDesign(c,d,v);const a=document.createElement('a');a.download=d.id+'-VORSCHAU.png';a.href=c.toDataURL('image/png');a.click()};update();
</script></html>
